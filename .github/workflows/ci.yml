name: CI

on:
  push:
    branches: [main, fix/core-implementation]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check --fix .

      - name: Type check (mypy)
        run: |
          mypy .

      - name: Run tests with coverage
        run: |
          pytest -q --cov=app --cov-fail-under=80

      - name: Build Docker image (api-server)
        run: |
          docker build -t rizz-api-server ./api-server

      - name: Optionally push Docker image (if tag)
        if: github.ref_type == 'tag'
        env:
          REGISTRY: ghcr.io
          IMAGE_NAME: ${{ github.repository }}-api-server
        run: |
          echo "$GITHUB_TOKEN" | docker login $REGISTRY -u ${{ github.actor }} --password-stdin
          docker tag rizz-api-server $REGISTRY/$IMAGE_NAME:${{ github.ref_name }}
          docker push $REGISTRY/$IMAGE_NAME:${{ github.ref_name }}
