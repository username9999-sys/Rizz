version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: rizz-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rizz_api}
      POSTGRES_USER: ${POSTGRES_USER:-rizz_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rizz_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: rizz-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env file}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # API Server
  api:
    build: ./api-server
    container_name: rizz-api
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rizz_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rizz_api}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env file}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in .env file}
      # Email configuration
      SMTP_HOST: ${SMTP_HOST:-smtp.example.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-user@example.com}
      SMTP_PASS: ${SMTP_PASS:-your_smtp_password}
      # Audit logging
      AUDIT_LOGGER_LEVEL: ${AUDIT_LOGGER_LEVEL:-INFO}
      # Feature flags
      FEATURE_EMAIL_VERIFICATION: ${FEATURE_EMAIL_VERIFICATION:-true}
      FEATURE_PASSWORD_RESET: ${FEATURE_PASSWORD_RESET:-true}
      FEATURE_AUDIT_LOG: ${FEATURE_AUDIT_LOG:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./api-server:/app
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # Web App (Frontend)
  web-app:
    build: ./web-app
    container_name: rizz-web-app
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      API_BASE_URL: http://api:5000
      # Feature flags
      FEATURE_EMAIL_VERIFICATION: ${FEATURE_EMAIL_VERIFICATION:-true}
      FEATURE_PASSWORD_RESET: ${FEATURE_PASSWORD_RESET:-true}
    depends_on:
      - api
    volumes:
      - ./web-app:/app
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # Monitoring (Prometheus + Grafana)
  monitoring:
    image: prom/prometheus:latest
    container_name: rizz-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    depends_on:
      - api
    networks:
      - rizz-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: rizz-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - web-app
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # PostgreSQL Exporter for metrics
  postgres-exporter:
    image: postgres-exporter:0.19.0
    container_name: rizz-postgres-exporter
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-rizz_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rizz_api}
    depends_on:
      - postgres
    networks:
      - rizz-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

networks:
  rizz-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  prometheus_data: