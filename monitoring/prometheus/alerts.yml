# Prometheus alerting rules for the Rizz platform.
#
# Severity levels:
#   - critical: page on-call (PagerDuty)
#   - warning:  notify Slack
#   - info:     log only

groups:
  # ---------- API service ----------
  - name: rizz_api
    interval: 30s
    rules:
      - alert: ApiDown
        expr: up{job="rizz-api"} == 0
        for: 1m
        labels:
          severity: critical
          service: api
        annotations:
          summary: "API service is down"
          description: "The rizz-api job has been unreachable for more than 1 minute."

      - alert: ApiHighErrorRate
        expr: |
          sum(rate(http_requests_total{job="rizz-api",status=~"5.."}[5m]))
            /
          sum(rate(http_requests_total{job="rizz-api"}[5m]))
            > 0.05
        for: 5m
        labels:
          severity: critical
          service: api
        annotations:
          summary: "API error rate above 5%"
          description: "More than 5% of API requests in the last 5 minutes returned 5xx."

      - alert: ApiHighLatency
        expr: |
          histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le))
            > 1.0
        for: 10m
        labels:
          severity: warning
          service: api
        annotations:
          summary: "API p95 latency above 1s"
          description: "95th percentile latency over the last 5 minutes exceeds 1 second."

      - alert: ApiLowThroughput
        expr: |
          sum(rate(http_requests_total{job="rizz-api"}[5m])) < 1
        for: 10m
        labels:
          severity: warning
          service: api
        annotations:
          summary: "API request rate is suspiciously low"
          description: "Fewer than 1 request/sec sustained for 10 minutes. May indicate upstream issue."

  # ---------- Database ----------
  - name: rizz_db
    interval: 30s
    rules:
      - alert: PostgresDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
          service: postgres
        annotations:
          summary: "Postgres is down"

      - alert: PostgresConnectionsHigh
        expr: pg_stat_activity_count > 80
        for: 5m
        labels:
          severity: warning
          service: postgres
        annotations:
          summary: "Postgres connection count above 80"
          description: "Consider scaling the connection pool or investigating slow queries."

      - alert: PostgresReplicationLag
        expr: pg_replication_lag_seconds > 30
        for: 2m
        labels:
          severity: warning
          service: postgres
        annotations:
          summary: "Postgres replica lag above 30s"

  # ---------- Cache ----------
  - name: rizz_cache
    interval: 30s
    rules:
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
          service: redis
        annotations:
          summary: "Redis is down"

      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 10m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: "Redis memory usage above 85%"

      - alert: RedisEvictionsHigh
        expr: rate(redis_evicted_keys_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: "Redis is evicting keys at high rate"
          description: "Consider increasing maxmemory or reviewing cache TTLs."

  # ---------- Host ----------
  - name: rizz_host
    interval: 30s
    rules:
      - alert: HostCpuHigh
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "CPU usage above 85%"

      - alert: HostMemoryHigh
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Memory usage above 90%"

      - alert: HostDiskFilling
        expr: |
          (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} 
                / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"})) * 100 > 85
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Disk usage above 85% on {{ $labels.instance }}"
          description: "Disk is filling up. Current: {{ $value | printf \"%.1f\" }}%"

      - alert: HostDiskWillFillIn24h
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}[6h], 24*3600) < 0
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "Disk will fill in 24h on {{ $labels.instance }}"
