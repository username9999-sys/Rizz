events {
    worker_connections 1024;
}

http {
    upstream api_server {
        server api:5000;
    }

    upstream portfolio_server {
        server portfolio:3000;
    }

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;   # tighter for auth
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=100r/s;

    # Connection limiting per IP
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Trust proxy headers (set real scheme/host from upstream)
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;

    # Hide nginx version in error pages
    server_tokens off;

    # Security: reject requests without a Host header (HTTP/1.0) or with bad hosts
    # (Uncomment in production with explicit allowlist)

    # === HTTP -> HTTPS redirect ===
    server {
        listen 80;
        server_name _;
        # ACME http-01 challenge must be served over plain HTTP for Let's Encrypt.
        # Match /.well-known/acme-challenge/ to the certbot webroot.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # === HTTPS server ===
    server {
        listen 443 ssl http2;
        server_name _;

        # SSL configuration. Cert paths are conventional; if you used
        # scripts/generate-tls-certs.sh they live in /etc/nginx/ssl/.
        # For Let's Encrypt: link to /etc/letsencrypt/live/<domain>/.
        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # Modern TLS only (TLS 1.2 + 1.3)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;

        # Connection / size limits
        limit_conn conn_limit 20;
        client_max_body_size 16m;
        client_body_timeout 30s;
        client_header_timeout 30s;

        # === Security headers (apply to all responses) ===
        # Prevent MIME-type sniffing
        add_header X-Content-Type-Options "nosniff" always;
        # Prevent clickjacking
        add_header X-Frame-Options "SAMEORIGIN" always;
        # Legacy XSS protection (mostly obsolete; modern browsers rely on CSP)
        add_header X-XSS-Protection "1; mode=block" always;
        # HSTS — force HTTPS for one year, including subdomains
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # Referrer policy — no leakage of full URLs
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Permissions policy — disable powerful features by default
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        # Content Security Policy — strict default; relax per route as needed
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        # Cross-origin policies
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        # Remove identifying Server header
        more_clear_headers Server;

        # Hide upstream information in case of errors
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;

        # === API routes ===
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://api_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 60s;
        }

        # Auth endpoints get a tighter rate limit
        location ~ ^/api/(auth|login|register) {
            limit_req zone=auth_limit burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://api_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # Portfolio / web app
        location / {
            limit_req zone=general_limit burst=50 nodelay;
            proxy_pass http://portfolio_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check (no rate limit, used by compose/orchestrator)
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
