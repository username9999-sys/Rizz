openapi: 3.0.3
info:
  title: Rizz API
  version: 2.0.0
  description: |
    REST API for the Rizz platform. Authentication via JWT bearer tokens.

    Conventions:
      All POST/PUT/PATCH requests must use Content-Type application/json.
      Requests with other content types return 415 Unsupported Media Type.
      All authenticated endpoints expect "Authorization: Bearer <token>".
      Rate limits per route (see each endpoint description).
      All error responses use the shape `{"error": "..."}`.

    Security notes:
      Passwords are stored hashed with PBKDF2-HMAC-SHA256 (100k iterations).
      Usernames and emails are unique.
      Tokens expire after 1 hour (3600s) by default.
      JSON bodies must be objects (arrays and bare values are rejected).
  contact:
    name: Rizz Dev
    url: https://github.com/username9999-sys/Rizz
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:5000
    description: Local development
  - url: https://localhost
    description: Local via nginx HTTPS (self-signed or Let's Encrypt)

tags:
  - name: auth
    description: Registration, login, profile
  - name: posts
    description: Blog-style post CRUD
  - name: system
    description: Health, metrics, info

paths:
  /api/auth/register:
    post:
      tags:
        - auth
      summary: Register a new user
      description: "Creates a new user account. Rate limit: 5 per minute. Returns the created user (no password or hash is ever returned)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPublic"
        "400":
          description: "Missing or invalid fields (e.g. password shorter than 8 chars)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Username or email already taken
        "415":
          description: Content-Type was not application/json

  /api/auth/login:
    post:
      tags:
        - auth
      summary: Log in with username and password
      description: "Rate limit: 5 per minute. Returns a JWT bearer token."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: alice_99
                password:
                  type: string
                  format: password
                  example: GoodPass99
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials
        "415":
          description: Content-Type was not application/json

  /api/auth/me:
    get:
      tags:
        - auth
      summary: Get current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPublic"
        "401":
          description: Missing or invalid bearer token

  /api/posts:
    get:
      tags:
        - posts
      summary: List posts
      description: "Public endpoint. Returns up to 50 most recent posts."
      responses:
        "200":
          description: List of posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostList"
    post:
      tags:
        - posts
      summary: Create a new post
      security:
        - bearerAuth: []
      description: "Rate limit: 60 per minute. Title is required (max 200 chars)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostCreate"
      responses:
        "201":
          description: Post created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          description: "Missing fields or title longer than 200 chars"
        "401":
          description: Missing or invalid bearer token
        "415":
          description: Content-Type was not application/json

  /api/posts/{post_id}:
    parameters:
      - in: path
        name: post_id
        required: true
        schema:
          type: integer
    get:
      tags:
        - posts
      summary: Get a post by id
      responses:
        "200":
          description: Post found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "404":
          description: Post not found
    put:
      tags:
        - posts
      summary: Update a post (owner only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostCreate"
      responses:
        "200":
          description: Post updated
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Authenticated user is not the post owner
        "404":
          description: Post not found
    delete:
      tags:
        - posts
      summary: Delete a post (owner only)
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Post deleted
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Authenticated user is not the post owner
        "404":
          description: Post not found

  /health:
    get:
      tags:
        - system
      summary: Liveness / health check
      responses:
        "200":
          description: Service is healthy
        "503":
          description: Service is degraded

  /metrics:
    get:
      tags:
        - system
      summary: Prometheus metrics
      responses:
        "200":
          description: Metrics in Prometheus text format
          content:
            text/plain:
              schema:
                type: string

  /api/v2:
    get:
      tags:
        - system
      summary: API info and endpoint catalog
      responses:
        "200":
          description: API info

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 30
          pattern: "^[a-zA-Z][a-zA-Z0-9_]*$"
          example: alice_99
        email:
          type: string
          format: email
          example: alice@example.com
        password:
          type: string
          format: password
          minLength: 8
          description: "At least 8 characters, must contain a letter and a digit"
          example: GoodPass99

    UserPublic:
      type: object
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: alice_99
        email:
          type: string
          example: alice@example.com

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: "JWT bearer token (HS256, 1h expiry)"
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: "#/components/schemas/UserPublic"

    PostCreate:
      type: object
      required:
        - title
        - content
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: My First Post
        content:
          type: string
          minLength: 1
          example: The body of the post.

    Post:
      type: object
      properties:
        id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 1
        title:
          type: string
          example: My First Post
        content:
          type: string
          example: The body of the post.
        created_at:
          type: number
          format: float
          example: 1757000000.0

    PostList:
      type: object
      properties:
        posts:
          type: array
          items:
            $ref: "#/components/schemas/Post"
        count:
          type: integer
          example: 2

    Error:
      type: object
      properties:
        error:
          type: string
          example: Missing required fields
        fields:
          type: array
          items:
            type: string
          description: Field names that failed validation (when applicable)
        details:
          type: object
          additionalProperties:
            type: string
          description: Per-field error messages (when applicable)
