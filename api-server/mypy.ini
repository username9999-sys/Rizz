[mypy]
# mypy configuration for the Rizz API server.
#
# Install mypy and run:   mypy app/utils app/config
#
# Goals for this project:
#   - 100% type-hint coverage on new code in app/utils/ and app/config/
#   - No implicit Any in exported function signatures
#   - Strict checking for utility modules (looser for app/__init__.py,
#     which has unresolved dependency issues)

python_version = 3.11
warn_unused_ignores = True
warn_redundant_casts = True
warn_return_any = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
no_implicit_optional = True
check_untyped_defs = True

# Per-module overrides: app/__init__.py has external dependencies that
# we don't import (prometheus, opentelemetry) so we allow it to be
# looser. The real type safety comes from app/utils/.

[mypy-app.__init__]
ignore_errors = True
ignore_missing_imports = True

[mypy-app.routes.*]
ignore_errors = True
ignore_missing_imports = True

[mypy-app.models.*]
ignore_errors = True
