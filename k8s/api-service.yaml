---
# API Server Service
apiVersion: v1
kind: Service
metadata:
  name: rizz-api
  namespace: rizz-platform
  labels:
    app: rizz-api
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "5000"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app: rizz-api
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP
      name: http