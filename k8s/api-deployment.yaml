---
# API Server Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rizz-api
  namespace: rizz-platform
  labels:
    app: rizz-api
    version: v2.0
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: rizz-api
  template:
    metadata:
      labels:
        app: rizz-api
        version: v2.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: rizz-api-sa
      securityContext:
        runAsNonRoot: true
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      containers:
        - name: api-server
          image: ghcr.io/username9999-sys/rizz/api-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
              name: http
              protocol: TCP
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rizz-api-secret
                  key: secret_key
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rizz-api-secret
                  key: jwt_secret
            - name: DATABASE_URL
              valueFrom:
                configMapRef:
                  name: rizz-api-config
            - name: REDIS_URL
              valueFrom:
                secretRef:
                  name: rizz-api-secret
                  key: redis_url
            - name: SMTP_HOST
              valueFrom:
                configMapRef:
                  name: rizz-api-config
            - name: SMTP_PORT
              valueFrom:
                configMapRef:
                  name: rizz-api-config
            - name: SMTP_USER
              valueFrom:
                secretRef:
                  name: rizz-api-secret
                  key: smtp_user
            - name: SMTP_PASS
              valueFrom:
                secretRef:
                  name: rizz-api-secret
                  key: smtp_pass
            - name: AUDIT_LOGGER_LEVEL
              value: "INFO"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
          volumeDevices: []
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp-volume
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - rizz-api
                topologyKey: kubernetes.io/hostname