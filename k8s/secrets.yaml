---
# Secrets for API Server (use external secrets manager in production!)
apiVersion: v1
kind: Secret
metadata:
  name: rizz-api-secret
  namespace: rizz-platform
type: Opaque
stringData:
  SECRET_KEY: "change-me-to-secure-random-string"
  JWT_SECRET_KEY: "change-me-to-secure-random-string"
  DATABASE_URL: "postgresql://rizz_user:CHANGE_ME@postgres:5432/rizz_api"
  REDIS_URL: "redis://redis:6379/0"
  # Email secrets
  SMTP_USER: "user@example.com"
  SMTP_PASS: "your_smtp_password"
  # Additional JWT claims
  JWT_AUDIENCE: "rizz-api"
  JWT_ISSUER: "rizz-api"
  # Feature flags (as plain text for demo; use external config in prod)
  FEATURE_EMAIL_VERIFICATION: "true"
  FEATURE_PASSWORD_RESET: "true"
  FEATURE_AUDIT_LOG: "true"